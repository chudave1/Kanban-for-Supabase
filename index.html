<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Kanban Board</h1>
        <div class="header-toolbar">
            <button type="button" id="add-task-open">Add Task</button>
            <button type="button" id="change-task" disabled>Change Task</button>
            <button type="button" id="delete-task" disabled>Delete Task</button>
        </div>
        <p id="board-status" class="board-status" aria-live="polite"></p>
    </header>
    <main class="board">
        <section class="column" data-column="To Do">
            <h2>To Do</h2>
        </section>
        <section class="column" data-column="In Progress">
            <h2>In Progress</h2>
        </section>
        <section class="column" data-column="Done">
            <h2>Done</h2>
        </section>
    </main>
    <div id="move-modal-backdrop" class="move-modal-backdrop" hidden>
        <div class="move-modal" role="dialog" aria-modal="true" aria-labelledby="move-modal-title">
            <h2 id="move-modal-title">Update Task for In Progress</h2>
            <div id="move-modal-task-summary" class="move-modal-task-summary"></div>
            <div class="move-modal-field">
                <label for="move-comment">Comment</label>
                <textarea id="move-comment" rows="3"></textarea>
            </div>
            <div class="move-modal-field">
                <label for="move-assign-to">Assign To</label>
                <select id="move-assign-to">
                    <option value="">Select a person…</option>
                </select>
            </div>
            <div class="move-modal-field">
                <label for="move-status">New Status</label>
                <select id="move-status">
                    <option value="">Select a status…</option>
                </select>
            </div>
            <p id="move-modal-error" class="move-modal-error" aria-live="polite"></p>
            <div class="move-modal-actions">
                <button type="button" id="move-cancel">Cancel</button>
                <button type="button" id="move-save">Save</button>
            </div>
        </div>
    </div>
    <div id="add-task-modal-backdrop" class="move-modal-backdrop" hidden>
        <div class="move-modal" role="dialog" aria-modal="true" aria-labelledby="add-task-modal-title">
            <h2 id="add-task-modal-title">Add Task</h2>
            <div class="move-modal-field">
                <label for="add-task-category">Category</label>
                <select id="add-task-category">
                    <option value="">Select a category…</option>
                </select>
            </div>
            <div class="move-modal-field">
                <label for="add-task-description">Description</label>
                <textarea id="add-task-description" rows="3"></textarea>
            </div>
            <div class="move-modal-field">
                <label for="add-task-due">Due Date</label>
                <input type="date" id="add-task-due">
            </div>
            <div class="move-modal-field">
                <label for="add-task-comment">Comment</label>
                <textarea id="add-task-comment" rows="3"></textarea>
            </div>
            <div class="move-modal-field">
                <label for="add-task-status">Status</label>
                <select id="add-task-status">
                    <option value="">Select a status…</option>
                </select>
            </div>
            <div class="move-modal-field">
                <label for="add-task-prerequisite">Prerequisite Task</label>
                <select id="add-task-prerequisite">
                    <option value="">None</option>
                </select>
            </div>
            <div class="move-modal-field">
                <label for="add-task-assign">Assigned To</label>
                <select id="add-task-assign">
                    <option value="">Select a person…</option>
                </select>
            </div>
            <p id="add-task-modal-error" class="move-modal-error" aria-live="polite"></p>
            <div class="move-modal-actions">
                <button type="button" id="add-task-cancel">Cancel</button>
                <button type="button" id="add-task-save">Save</button>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/secrets.js"></script>
    <script src="js/kanban.js"></script>
</body>
</html>
